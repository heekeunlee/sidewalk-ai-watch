<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>보도 AI 감지 기획</title>
<style>
:root{color-scheme:light;--bg:#f7f9fc;--surface:#fff;--text:#1b2433;--muted:#5d6878;--line:#e3e8ef;--accent:#2563eb;--accent-soft:#eaf1ff;--warn:#fff6e8;--ok:#ecf8f1;--ink:#2a2f3a;--paper:#fffdf8;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;word-break:keep-all}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:360px;text-align:center}
.gate-box h1{font-size:20px;margin:0 0 8px}
.gate-box p{color:var(--muted);margin:0 0 20px;font-size:14px}
.gate-box input{width:100%;padding:12px;font-size:18px;text-align:center;letter-spacing:.3em;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.gate-box button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;cursor:pointer}
.err{color:#d64545;font-size:14px;min-height:1.5em;margin-top:8px}
#app{display:none}
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:28px 16px}
header.top .in{max-width:1100px;margin:0 auto}
header.top h1{margin:0;font-size:28px}
header.top p{margin:6px 0 0;color:var(--muted)}
.layout{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:200px 1fr;gap:32px;padding:24px 16px 80px}
nav.toc{position:sticky;top:16px;align-self:start;font-size:14px}
nav.toc a{display:block;padding:6px 10px;color:var(--muted);text-decoration:none;border-radius:8px}
nav.toc a:hover{background:var(--accent-soft);color:var(--accent)}
main section{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;margin-bottom:24px;min-width:0}
.eyebrow{color:var(--accent);font-weight:700;font-size:13px;margin:0}
h2{margin:4px 0 12px;font-size:24px}
h3{margin:28px 0 10px;font-size:18px}
h4{margin:0 0 6px;font-size:16px}
.lead{font-size:17px}
.grid2,.grid3{display:grid;gap:12px;margin:12px 0}
.grid2{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg)}
.card p,.card ul{margin:0;font-size:15px}.card ul{padding-left:18px}
.card.warn{background:var(--warn)}.card.ok{background:var(--ok)}
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);padding:14px 16px;border-radius:8px;margin:16px 0}
.note{color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}
th{background:var(--bg);white-space:nowrap}
td small{color:var(--muted)}
.steps li,.check li{margin:6px 0}
.check{list-style:none;padding:0}.check li::before{content:"☐ ";color:var(--accent)}
.timeline{display:grid;gap:12px}
.phase{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:16px;background:var(--bg)}
.phase ul{margin:6px 0 0;padding-left:18px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px;margin-bottom:6px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0}
.flow div{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-weight:700;text-align:center;font-size:14px}
.flow small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.flow span{color:var(--muted)}
.formula{font-family:ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);padding:14px;border-radius:10px;font-size:14px}
pre{background:#f3f6fb;color:#1b2433;border:1px solid var(--line);padding:16px;border-radius:10px;overflow-x:auto;font-size:13.5px}
.sb{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
.panel{position:relative;margin:0;border:1.5px solid var(--ink);border-radius:6px;background:var(--paper);overflow:hidden}
.panel svg{display:block;width:100%;height:auto;border-bottom:1.5px dashed var(--line)}
.panel figcaption{padding:12px 14px;font-size:14.5px}
.panel figcaption b{display:block;font-size:15.5px;margin-bottom:2px}
.sn{position:absolute;top:8px;left:10px;font:700 12px ui-monospace,Menlo,monospace;color:var(--ink);background:var(--paper);padding:1px 6px;border:1px solid var(--ink);border-radius:4px}
.diagram{margin:14px 0;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:12px}
.diagram svg{display:block;width:100%;max-width:640px;height:auto;margin:0 auto}
.diagram figcaption{color:var(--muted);font-size:14px;text-align:center;margin-top:6px}
svg.ink{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.ink .thin{stroke-width:1.3}
svg.ink .accent{stroke:var(--accent)}
svg.ink .fillacc{fill:var(--accent);stroke:var(--accent)}
svg.ink .fillsoft{fill:var(--accent-soft)}
svg.ink .t{fill:var(--ink);stroke:none;font-size:13px;font-family:inherit}
svg.ink .t.s{font-size:11.5px}
svg.ink .t.mid{text-anchor:middle}
svg.ink .t.acc{fill:var(--accent);font-weight:700}
svg.ink .t.w{fill:#fff;font-weight:700}
footer{color:var(--muted);font-size:13px;text-align:center;padding:24px 16px}
@media (max-width:820px){.layout{grid-template-columns:1fr}nav.toc{display:none}.grid2,.grid3,.sb{grid-template-columns:1fr}table{display:block;overflow-x:auto}main section{padding:20px}}
</style>
</head>
<body>
<div id="gate">
  <form class="gate-box" id="gateForm">
    <h1>보도블럭 AI 감지 기획서</h1>
    <p>비밀번호를 입력하세요</p>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" autofocus>
    <button type="submit">열기</button>
    <div class="err" id="err"></div>
  </form>
</div>
<div id="app">
  <header class="top"><div class="in">
    <h1>보도블럭 비평탄화 AI 자동 감지</h1>
    <p>사회문제 해결 챌린지 기획안 · 문제 정의부터 비용 비교까지</p>
  </div></header>
  <div class="layout">
    <nav class="toc">
      <a href="#overview">01 문제 정의</a><a href="#storyboard">· 콘티 8컷</a><a href="#plan">02 기획</a><a href="#strategy">03 감지 전략</a><a href="#rain">· 비 온 뒤 감지</a><a href="#action">04 실천 방법</a><a href="#build">05 구현 방안</a><a href="#impact">06 파급효과</a><a href="#cost">07 비용 비교</a><a href="#risk">08 리스크</a><a href="#checklist">09 공모 준비</a>
    </nav>
    <main id="content"></main>
  </div>
  <footer>sidewalk-ai-watch</footer>
</div>
<script>
const PAYLOAD = __PAYLOAD__;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
  return new TextDecoder().decode(plain);
}
async function showContent(pw, remember) {
  const html = await unlock(pw);
  document.getElementById("content").innerHTML = html;
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  if (remember) try { sessionStorage.setItem("pw", pw); } catch (e) {}
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
}
document.getElementById("gateForm").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "확인 중...";
  try { await showContent(document.getElementById("pw").value, true); }
  catch { err.textContent = "비밀번호가 올바르지 않습니다."; }
});
try { const saved = sessionStorage.getItem("pw"); if (saved) showContent(saved, false).catch(() => {}); } catch (e) {}
</script>
</body>
</html>
